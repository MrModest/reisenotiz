<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Reisenotiz PWA" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" data-scheme="light" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" data-scheme="dark" />
    <!-- Applies a theme pinned in Settings before first paint. Mirrors applyTheme in src/hooks/use-theme.ts. -->
    <script>
      ;(function (theme) {
        if (theme !== 'light' && theme !== 'dark') return
        document.querySelector('meta[name="color-scheme"]').content = theme
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
          meta.media = meta.dataset.scheme === theme ? 'all' : 'not all'
        })
      })(localStorage.getItem('theme'))
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Reisenotiz</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
