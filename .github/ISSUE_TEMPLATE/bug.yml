name: Bug report
description: Something in Reisenotiz doesn't work as it should.
labels: [bug, needs-triage]
body:
  - type: textarea
    id: setup
    attributes:
      label: Version and setup
      description: Version you run; Docker or from source; with or without the sync server.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: From a fresh page load. Then what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Anything relevant, with tokens and personal data removed.
      render: shell
